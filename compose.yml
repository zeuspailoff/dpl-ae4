services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelroad
      POSTGRES_USER: alumno
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CAMBIAR_ESTO}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumno -d travelroad"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-CAMBIAR_ESTO}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ./app
    environment:
      APP_MENSAJE: ${APP_MENSAJE:-Hola desde Compose}
      APP_DATA_DIR: /data
      DB_HOST: db
      DB_NAME: travelroad
      DB_USER: alumno
      DB_PASSWORD: ${DB_PASSWORD:-CAMBIAR_ESTO}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  pgadmin_data: